name: Deploy

on:
  workflow_run:
    workflows: ["Tests"]
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'viewsets'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "=== Fingerprint of key from secret ==="
          ssh-keygen -lf ~/.ssh/deploy_key
          echo "=== Fingerprint of server host key ==="
          ssh-keyscan -H ${{ secrets.SSH_HOST }} 2>/dev/null | ssh-keygen -lf -

      - name: Test SSH connection
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -v deploy@${{ secrets.SSH_HOST }} 'echo SSH OK'
      - name: Upload project files
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".env" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ deploy@${{ secrets.SSH_HOST }}:/home/deploy/education/

      - name: Build and deploy Docker containers
        run: |
          ssh -i ~/.ssh/deploy_key deploy@${{ secrets.SSH_HOST }} << 'EOF'
            cd /home/deploy/education
            docker compose down --remove-orphans || true
            docker compose up -d --build
            docker compose exec -T web python manage.py migrate --noinput
            docker compose ps
          EOF
